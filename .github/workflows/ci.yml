name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv python install "${{ matrix.python-version }}"
      - run: uv sync --locked --group dev
      - name: Check Python lint
        run: uv run ruff check src tests scripts
      - name: Check Python formatting
        run: uv run ruff format --check src tests scripts
      - run: uv run ty check --output-format github
      - run: uv run pytest
      - run: uv run marimo check --strict notebooks/*.py
      - name: Build from generated-asset-free checkout
        run: |
          rm -f src/marimo_mmp/static/transform_graph.js
          rm -f src/marimo_mmp/static/transform_graph.css
          uv run hatch build --clean
      - run: uv run python scripts/verify_distribution_assets.py dist/*
