name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test, and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # uv sync invokes the Hatch frontend build hook on a clean checkout.
      - run: npm ci
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --group dev
      - name: Validate release tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$RELEASE_TAG"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be MAJOR.MINOR.PATCH; got '$RELEASE_TAG'" >&2
            exit 1
          fi
          package_version="$(uv run hatch version)"
          if [[ "$RELEASE_TAG" != "$package_version" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match project version '$package_version'" >&2
            exit 1
          fi
      - run: npm run check
      - name: Check Python lint
        run: uv run ruff check src tests scripts
      - name: Check Python formatting
        run: uv run ruff format --check src tests scripts
      - run: uv run ty check --output-format github
      - run: uv run pytest
      - run: uv run marimo check --strict notebooks/*.py
      - name: Build distributions from generated-asset-free checkout
        run: |
          rm -f src/marimo_mmp/static/transform_graph.js
          rm -f src/marimo_mmp/static/transform_graph.css
          uv run hatch build --clean
      - run: uv run python scripts/verify_distribution_assets.py dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Create draft release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --generate-notes
          dist/*

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/marimo-mmp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
